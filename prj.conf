# TF-M config
CONFIG_TFM_PROFILE_TYPE_MINIMAL=y

# General config
CONFIG_SERIAL=y

# GPIO, for the failure-simulation inputs (P0.21 cellular, P0.22 satellite;
# see boards/mtc2n9151_nrf9151_ns.overlay). Float = normal, ground = that network
# never counts as connected (timeouts still run in full).
CONFIG_GPIO=y

# Shell, for sending UDP data manually with "udp send <text>"
CONFIG_SHELL=y

# AT shell, so raw AT commands can be issued at runtime with "at <cmd>".
# Used to interrogate the modem live (e.g. "at AT+CEER", "at AT+CEREG?") while
# debugging registration, mirroring the manual AT sequence that works.
CONFIG_AT_SHELL=y

# Network
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_POSIX_API=y

# LTE link control
CONFIG_LTE_LINK_CONTROL=y
CONFIG_LTE_NETWORK_MODE_NTN_NBIOT=y

# Disable PLMN selection optimization. lte_lc enables it by default (AT%FEACONF=
# 0,3,1) to speed up the initial search for stationary *terrestrial* devices, but
# on Skylo NTN it makes the modem reject the satellite PLMN ("no suitable cell",
# reg status 91). The known-good manual AT sequence never sets %FEACONF, so leave
# the optimization off to match it.
CONFIG_LTE_PLMN_SELECTION_OPTIMIZATION=n

# Modem library
CONFIG_NRF_MODEM_LIB=y

# NTN (Non-Terrestrial Network) helper library
CONFIG_NTN=y

# Wall-clock time for the %t payload token. Sources modem/network time (NITZ)
# first and falls back to NTP over the IP connection. No battery RTC, so %t
# reads 0 until time is acquired from one of these sources.
CONFIG_DATE_TIME=y

# Floating-point printf support. AT%LOCATION=2 formats the coordinates with %f
# (both ntn_location_set() and this app's set_initial_location()). picolibc
# omits float conversion unless this is set, which would send blank coordinates
# and leave the modem searching for a satellite forever.
CONFIG_PICOLIBC_IO_FLOAT=y

# Heap and stacks. Main stack bumped for the GNSS acquisition / re-attach path
# (nested modem calls plus float-formatted logging under picolibc).
CONFIG_HEAP_MEM_POOL_SIZE=1024
CONFIG_MAIN_STACK_SIZE=4096

# LooUQ test
# Do NOT allocate a dedicated CID: the APN must be set on the default context
# (cid 0), which is what the LTE attach uses. With a new CID the attach context
# stays blank and the Skylo network rejects the PDN half of the attach
# (AT+CEER reports "EMM 19" = ESM failure), so registration never completes.
CONFIG_UDP_ALLOC_NEW_CID=n
# Monogoto APN, used on both cellular and satellite (Monogoto roams onto Skylo).
CONFIG_UDP_APN="go.mono"

# override default bandlist to Skylo test requiements. The modem will scan only these bands for faster registration.
# This feeds AT%XBANDLOCK in modem_init(); CONFIG_LTE_BAND_LIST is not a real symbol.
CONFIG_NTN_BAND_LIST="255"

# Cellular (terrestrial) link. Cellular is tried first and kept once connected.
# If a cellular test times out, satellite is used for LINK_TN_PROBE_INTERVAL_S,
# then cellular is tested again. The APN above (CONFIG_UDP_APN) is used on both.
CONFIG_LINK_TN_MODE_LTEM=y
# Monogoto US LTE-M bands: B2/B4/B12 (AT&T, T-Mobile, Verizon urban), B13
# (Verizon), B66 (T-Mobile/AT&T). Empty = no band lock (search every band).
CONFIG_LINK_TN_BAND_LIST="2,4,12,13,66"
# How long each cellular test waits to connect before switching to satellite.
CONFIG_LINK_ATTACH_TIMEOUT_TN_S=300
# Consecutive sends with no reply before the live link counts as lost (0 = off).
CONFIG_LINK_FAIL_SENDS=2
# Satellite period between cellular tests (includes the satellite attach).
CONFIG_LINK_TN_PROBE_INTERVAL_S=900

# set these to your real UDP server endpoint
CONFIG_UDP_SERVER_ADDRESS="udp.tip.us-e1.tago.io"
CONFIG_UDP_SERVER_PORT=5683

# Wait this long after sending before listening for the reply (high-latency NTN).
# Tune to taste; 0 disables.
CONFIG_UDP_RECV_DELAY_MS=500
# How long recv() waits for a reply before logging "No reply".
CONFIG_UDP_RECV_TIMEOUT_S=20

# Location source. Set CONFIG_NTN_LOCATION to fixed "lat,lon,alt" (decimal degrees,
# altitude in meters) to use a known position (bench testing, or sites with poor sky
# view). Leave it EMPTY to acquire the position dynamically from the nRF9151 internal
# GNSS receiver at boot (and again whenever the modem requests a fresh location).
CONFIG_NTN_LOCATION=""
# Fixed-location example: CONFIG_NTN_LOCATION="44.698883,-85.600258,153.025009"  # LooUQ, Traverse City, MI, USA

# GNSS fix retry timeout (s); 0 = run until a valid fix (block until fix).
CONFIG_GNSS_FIX_RETRY_S=0
# Validity (s) reported with each NTN location update; finite so the modem asks for
# refreshes. 0 = infinite (permanently stationary device).
CONFIG_NTN_LOCATION_VALIDITY_S=3600
# Reuse the cached GNSS fix for modem location requests newer than this; older ones
# trigger a full re-acquire (which briefly drops the NTN link).
CONFIG_NTN_REFIX_MIN_INTERVAL_S=600
# COEX0 command that gates the external GNSS LNA/RF path. Board-specific for the
# MTC2-N9151; empty string skips it. Default enables COEX0 over the GPS L1 band.
CONFIG_GNSS_COEX0_CMD="AT%XCOEX0=1,1,1570,1580"

# Skylo LooUQ test parameters
CONFIG_TEST_NAME="SKYLO_FT-0"
CONFIG_TEST_INTERVAL=120
# CONFIG_TAGO_DEVICE_TOKEN and CONFIG_TAGO_HASH live in secrets.conf (not
# committed). Copy secrets.conf.example to secrets.conf and fill them in.

# Template for TagoIO TIP payload. Tokens will be replaced at runtime with real values. 
# See the app code for details.
# Tokens: %n name, %c counter, %r RSRP dBm, %q RSRQ dB, %s SNR dB, %t unix epoch seconds, %% literal %
CONFIG_TEST_PAYLOADTEMPLATE="PUSH|%h|%i|[tid=%n;ts:=%t;seq:=%c;rsrp:=%r;rsrq:=%q;sinr:=%s]"
